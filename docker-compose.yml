services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: subflow_development }
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, timeout: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 5s, retries: 10 }
  web:
    build: .
    command: bash -lc "bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    ports: ["3000:3000"]
    volumes: [.:/rails]
    environment:
      RAILS_ENV: development
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://redis:6379/0
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:-development-webhook-secret}"
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_healthy } }
  worker:
    build: .
    command: bundle exec sidekiq -C config/sidekiq.yml
    volumes: [.:/rails]
    environment:
      RAILS_ENV: development
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://redis:6379/0
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:-development-webhook-secret}"
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_healthy } }
volumes: { postgres_data: {}, redis_data: {} }
